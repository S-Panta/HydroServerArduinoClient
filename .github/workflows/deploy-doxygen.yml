name: Deploy docs using Doxygen
on:
  push:
    branches:
      - main 
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: DenverCoder1/doxygen-github-pages-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/doxygen
          config_file: Doxyfile
          doxygen_version: 1.9.6