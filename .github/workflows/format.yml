name: Clang Format Checker
on: 
  push:
    branches: &branches
      - main
    paths: &paths
      - src/**
      - examples/**/*.ino
      - .github/workflows/*.yml
  pull_request:
    branches: *branches
    paths: *paths
  
jobs:
  clang-format-checking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: RafikFarhad/clang-format-github-action@v6
        with:
          sources: "src/*.h,src/*.cpp,examples/**/**/*.ino"